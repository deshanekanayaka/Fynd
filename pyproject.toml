[project]
name = "fynd"
version = "0.1.0"
description = "Fynd helps a final year project student start from a real problem with evidence behind it."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fynd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E and F are the basics, I sorts imports, UP keeps the syntax modern.
select = ["E", "F", "I", "UP"]
